
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Ecoesfera CRM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            color: #26352b;
        }

        header {
            background: #247a43;
            color: white;
            padding: 22px 30px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(230px, 1fr)
            );
            gap: 20px;
            margin-top: 25px;
        }

        .tarjeta {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px #00000012;
        }

        .tarjeta h3 {
            color: #247a43;
            margin-top: 0;
        }

        .precio {
            font-size: 22px;
            font-weight: bold;
        }

        .estado {
            color: #247a43;
            font-weight: bold;
        }

        .mensaje {
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        button {
            background: #247a43;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #195d32;
        }
    </style>
</head>

<body>
    <header>
        <h1>Ecoesfera</h1>
        <p>Gestión de productos naturales</p>

        <nav>
            <a href="/index.html">Panel principal</a>
            <a href="/productos.html">Productos</a>
        </nav>
    </header>

    <main>
        <div class="encabezado">
            <div>
                <h2>Catálogo de productos</h2>
                <p>Consulta los productos registrados en el sistema.</p>
            </div>

            <button onclick="cargarProductos()">
                Actualizar catálogo
            </button>
        </div>

        <p id="mensaje" class="mensaje">
            Cargando productos...
        </p>

        <section id="listaProductos" class="productos"></section>
    </main>

    <script>
        async function cargarProductos() {
            const mensaje = document.getElementById("mensaje");
            const lista = document.getElementById("listaProductos");

            mensaje.textContent = "Cargando productos...";
            lista.replaceChildren();

            try {
                const respuesta = await fetch("/api/productos");

                if (!respuesta.ok) {
                    throw new Error("No se pudieron consultar los productos.");
                }

                const productos = await respuesta.json();

                if (productos.length === 0) {
                    mensaje.textContent =
                        "Todavía no hay productos registrados.";
                    return;
                }

                mensaje.textContent =
                    "Productos registrados: " + productos.length;

                productos.forEach(producto => {
                    const tarjeta = document.createElement("article");
                    tarjeta.className = "tarjeta";

                    const nombre = document.createElement("h3");
                    nombre.textContent = producto.nombre;

                    const descripcion = document.createElement("p");
                    descripcion.textContent =
                        producto.descripcion || "Sin descripción";

                    const precio = document.createElement("p");
                    precio.className = "precio";
                    precio.textContent = "$" +
                        Number(producto.precioVenta).toLocaleString("es-CO");

                    const stock = document.createElement("p");
                    stock.textContent = "Existencias: " + producto.stock;

                    const estado = document.createElement("p");
                    estado.className = "estado";
                    estado.textContent = producto.estado
                        ? "Activo"
                        : "Inactivo";

                    tarjeta.append(
                        nombre, descripcion, precio, stock, estado
                    );

                    lista.appendChild(tarjeta);
                });

            } catch (error) {
                mensaje.textContent =
                    "No fue posible cargar los productos. " +
                    "Comprueba que Spring Boot esté ejecutándose.";
                console.error(error);
            }
        }

        cargarProductos();
    </script>
</body>
</html>
